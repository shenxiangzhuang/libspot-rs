name: Test libspot (FFI)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'crates/libspot/**'
      - '.github/workflows/test-libspot.yaml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'crates/libspot/**'
      - '.github/workflows/test-libspot.yaml'
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-libspot:
    name: Test libspot (FFI bindings)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-libspot-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-libspot-cargo-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config

    - name: Build C library
      run: |
        cd crates/libspot/libspot
        make clean
        make

    - name: Check formatting (libspot)
      run: |
        cargo fmt -p libspot -- --check

    - name: Run clippy (libspot)
      run: |
        cargo clippy -p libspot --all-targets --all-features --locked -- -D warnings

    - name: Build libspot
      run: |
        cargo build -p libspot --locked --verbose

    - name: Run unit tests (libspot)
      run: |
        cargo test -p libspot --locked --lib --verbose

    - name: Run integration tests (libspot)
      run: |
        cargo test -p libspot --locked --test integration --verbose

    - name: Run basic example test (libspot)
      run: |
        cargo test -p libspot --locked --test basic_example test_basic_example_behavior --verbose

    - name: Run doc tests (libspot)
      run: |
        cargo test -p libspot --locked --doc --verbose
