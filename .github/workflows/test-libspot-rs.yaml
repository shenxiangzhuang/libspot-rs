name: Test libspot-rs (Pure Rust)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'crates/libspot-rs/**'
      - '.github/workflows/test-libspot-rs.yaml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'crates/libspot-rs/**'
      - '.github/workflows/test-libspot-rs.yaml'
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-libspot-rs:
    name: Test libspot-rs (Pure Rust implementation)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-libspot-rs-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-libspot-rs-cargo-

    - name: Check formatting (libspot-rs)
      run: |
        cargo fmt -p libspot-rs -- --check

    - name: Run clippy (libspot-rs)
      run: |
        cargo clippy -p libspot-rs --all-targets --all-features --locked -- -D warnings

    - name: Build libspot-rs
      run: |
        cargo build -p libspot-rs --locked --verbose

    - name: Run unit tests (libspot-rs)
      run: |
        cargo test -p libspot-rs --locked --lib --verbose

    - name: Run integration tests (libspot-rs)
      run: |
        cargo test -p libspot-rs --locked --tests --all-features --verbose

    - name: Test without default features (libspot-rs)
      run: |
        cargo test -p libspot-rs --locked --no-default-features --lib --tests --verbose

    - name: Run doc tests (libspot-rs)
      run: |
        cargo test -p libspot-rs --locked --doc --verbose

    - name: Run examples (libspot-rs)
      run: |
        cargo run -p libspot-rs --locked --example basic_pure
